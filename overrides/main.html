{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% if page and page.file %}
    <meta name="tssr-source-path" content="{{ page.file.src_uri | e }}">
  {% endif %}
{% endblock %}

{% block content %}
  {% if page and page.file %}
    <span data-tssr-source-path="{{ page.file.src_uri | e }}" hidden></span>
  {% endif %}
  {{ super() }}
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script src="{{ 'assets/javascripts/mermaid.min.js' | url }}"></script>
  <script>
    window.renderTssrMermaid = function (root) {
      if (typeof mermaid === "undefined") return;
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: "strict",
        theme: document.body.getAttribute("data-md-color-scheme") === "slate" ? "dark" : "base",
        fontFamily: "Inter, system-ui, sans-serif",
        flowchart: { htmlLabels: true, curve: "basis" }
      });
      var scope = root && root.querySelectorAll ? root : document;
      var diagrams = Array.from(scope.querySelectorAll(".mermaid:not([data-processed='true'])"));
      diagrams.forEach(function (diagram) {
        diagram.dataset.tssrSource = diagram.textContent.trim();
      });
      mermaid.run({ nodes: diagrams, suppressErrors: false }).catch(function (error) {
        diagrams.forEach(function (diagram) {
          diagram.dataset.tssrMermaidError = error && error.message ? error.message : String(error);
          if (!diagram.textContent.trim()) diagram.textContent = diagram.dataset.tssrSource;
        });
        console.error("Mermaid render error:", error && error.message ? error.message : error);
      });
    };
    var tssrMermaidScheme = document.body.getAttribute("data-md-color-scheme") || "";
    new MutationObserver(function () {
      var nextScheme = document.body.getAttribute("data-md-color-scheme") || "";
      if (nextScheme === tssrMermaidScheme) return;
      tssrMermaidScheme = nextScheme;
      document.querySelectorAll(".mermaid[data-tssr-source]").forEach(function (diagram) {
        diagram.removeAttribute("data-processed");
        diagram.textContent = diagram.dataset.tssrSource;
      });
      window.renderTssrMermaid();
    }).observe(document.body, { attributes: true, attributeFilter: ["data-md-color-scheme"] });
    if (typeof document$ !== "undefined") {
      document$.subscribe(function () { window.renderTssrMermaid(); });
      window.renderTssrMermaid();
    } else if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", window.renderTssrMermaid, { once: true });
    } else {
      window.renderTssrMermaid();
    }
  </script>
{% endblock %}
