{% extends "base.html" %}

{% block scripts %}
  {{ super() }}
  <script src="{{ 'assets/javascripts/mermaid.min.js' | url }}"></script>
  <script>
    window.renderTssrMermaid = function () {
      if (typeof mermaid === "undefined") return;
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: "strict",
        theme: document.body.getAttribute("data-md-color-scheme") === "slate" ? "dark" : "base",
        fontFamily: "Inter, system-ui, sans-serif",
        flowchart: { htmlLabels: true, curve: "basis" }
      });
      var diagrams = Array.from(document.querySelectorAll(".mermaid:not([data-processed='true'])"));
      diagrams.forEach(function (diagram) {
        diagram.dataset.tssrSource = diagram.textContent.trim();
      });
      mermaid.run({ nodes: diagrams, suppressErrors: false }).catch(function (error) {
        diagrams.forEach(function (diagram) {
          diagram.dataset.tssrMermaidError = error && error.message ? error.message : String(error);
          if (!diagram.textContent.trim()) diagram.textContent = diagram.dataset.tssrSource;
        });
        console.error("Mermaid render error:", error && error.message ? error.message : error);
      });
    };
    if (typeof document$ !== "undefined") {
      document$.subscribe(function () { window.renderTssrMermaid(); });
      window.renderTssrMermaid();
    } else if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", window.renderTssrMermaid, { once: true });
    } else {
      window.renderTssrMermaid();
    }
  </script>
{% endblock %}
