site_name: TSSR · Portail de formation
site_description: Apprendre, pratiquer et diagnostiquer avec les cours, TP, révisions et mémos de la formation TSSR.
site_author: Portail personnel de formation
site_url: https://sk34pk25.github.io/tssr-cours/
copyright: Formation TSSR · Documentation personnelle
use_directory_urls: true
strict: true
theme:
  name: material
  custom_dir: overrides
  language: fr
  icon:
    logo: material/server-network
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.prune
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer au thème sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer au thème clair
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - toc:
      permalink: true
plugins:
  - search:
      lang: fr
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: fade
      zoomable: true
      draggable: true
      auto_themed: true
      auto_caption: false
extra_css:
  - assets/stylesheets/tokens.css
  - assets/stylesheets/base.css
  - assets/stylesheets/navigation.css
  - assets/stylesheets/components.css
  - assets/stylesheets/chronology.css
  - assets/stylesheets/visuals.css
  - assets/stylesheets/homepage.css
  - assets/stylesheets/responsive.css
  - assets/stylesheets/print.css
extra_javascript:
  - assets/javascripts/extra.js
extra:
  generator: false
