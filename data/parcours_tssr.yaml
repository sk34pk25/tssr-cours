# Planning formation TSSR

Objectif: fournir un planning de formation simple, explicite et facilement interprétable par une IA.

Contexte:
- Formation: TSSR
- Modalité principale: En ligne (Campus en ligne)
- Les dates sont au format ISO AAAA-MM-JJ.
- Le statut de chaque période ne doit PAS être considéré comme une donnée fixe.
- L’IA doit calculer le statut au moment de la lecture en utilisant la date actuelle :
  - si date_actuelle < date_debut : statut = a_venir
  - si date_debut <= date_actuelle <= date_fin : statut = en_cours
  - si date_actuelle > date_fin : statut = passe
- Cette règle doit être recalculée à chaque utilisation du fichier.
- "\"non renseigné\" signifie que le formateur n'était pas indiqué dans les données fournies."

