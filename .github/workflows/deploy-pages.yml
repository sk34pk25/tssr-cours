name: Publier le site

# Chaque push publie le site, quelle que soit la branche.
# « Run workflow » relance aussi la publication, sur la branche par défaut.
# Le dépôt d’origine est exclu : cette branche ne remplace pas le site déjà en ligne.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cours-statique-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository != 'sk34pk25/tssr-cours'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer MkDocs
        run: python -m pip install --requirement requirements.txt

      - name: Calculer l’adresse du site
        run: |
          if [ "$GITHUB_REPOSITORY" = "sk34pk25/tssr-cours" ]; then
            echo "Publication refusée pour le dépôt d’origine."
            exit 1
          fi
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repo="$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          if [ "$repo" = "${owner}.github.io" ]; then
            printf 'SITE_URL=https://%s.github.io/\n' "$owner" >> "$GITHUB_ENV"
          else
            printf 'SITE_URL=https://%s.github.io/%s/\n' "$owner" "$repo" >> "$GITHUB_ENV"
          fi
          printf 'REPO_URL=https://github.com/%s\n' "$GITHUB_REPOSITORY" >> "$GITHUB_ENV"

      - name: Construire le site
        run: mkdocs build --strict

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.repository != 'sk34pk25/tssr-cours'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
