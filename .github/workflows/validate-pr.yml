name: Validate pull requests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ !startsWith(github.head_ref, 'collaboration/change-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed commit
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Test the browser editor and collaboration code
        run: npm test

      - name: Test shared Supabase functions
        run: npx --yes deno-bin@2.2.7 test --allow-env 'supabase/functions/_shared/*_test.ts'

      - name: Type-check change request function
        run: npx --yes deno-bin@2.2.7 check supabase/functions/change-requests/index.ts

      - name: Generate and validate glossary
        run: python scripts/build_glossary.py

      - name: Validate course relations
        run: python scripts/validate_course_structure.py

      - name: Strict MkDocs validation
        run: mkdocs build --strict
