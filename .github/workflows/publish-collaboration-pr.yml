name: Validate and merge collaborative publication

# The workflow definition and all privileged inline code come from the base
# branch, never from the proposed commit. Branch naming alone grants no trust.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: publish-collaboration-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  attest:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.head_ref, 'collaboration/change-')
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      change_id: ${{ steps.attestation.outputs.change_id }}
      expected_sha: ${{ steps.attestation.outputs.expected_sha }}
      pr_number: ${{ steps.attestation.outputs.pr_number }}
    steps:
      # No checkout, actions from the PR, dependencies, or repository code here.
      - name: Attest approved publication with Supabase
        id: attestation
        env:
          WEBHOOK_URL: ${{ secrets.SUPABASE_PUBLICATION_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.SUPABASE_PUBLICATION_WEBHOOK_SECRET }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          uuid = r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
          branch = re.fullmatch(rf"collaboration/change-({uuid})", os.environ["HEAD_BRANCH"])
          sha = os.environ["HEAD_SHA"]
          number = os.environ["PR_NUMBER"]
          if not branch or not re.fullmatch(r"[0-9a-f]{40}", sha) or not re.fullmatch(r"[1-9][0-9]*", number):
              raise SystemExit("Invalid collaborative publication identity.")
          change_id = branch.group(1)
          url, secret = os.environ["WEBHOOK_URL"], os.environ["WEBHOOK_SECRET"]
          if not url or not secret:
              raise SystemExit("Publication attestation is not configured.")
          request = urllib.request.Request(url, method="POST", headers={
              "content-type": "application/json", "x-publication-secret": secret,
          }, data=json.dumps({
              "action": "verify-pr", "change_request_id": change_id,
              "commit_sha": sha, "pr_number": int(number),
          }).encode())
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except Exception:
              raise SystemExit("Publication attestation failed; no merge is authorized.") from None
          if (result.get("maintenance_protocol") != "tssr-maintenance-v1"
                  or result.get("ok") is not True or result.get("change_request_id") != change_id
                  or result.get("expected_sha") != sha or type(result.get("pr_number")) is not int
                  or result["pr_number"] != int(number)):
              raise SystemExit("Publication attestation does not match this exact PR head.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"change_id={change_id}\nexpected_sha={sha}\npr_number={number}\n")
          PY

  validate:
    name: TSSR-validate-v1|${{ needs.attest.outputs.change_id }}|${{ needs.attest.outputs.expected_sha }}|${{ needs.attest.outputs.expected_sha }}
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout proposed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.attest.outputs.expected_sha }}
          persist-credentials: false

      - name: Verify checked-out validation commit
        env:
          EXPECTED_SHA: ${{ needs.attest.outputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install MkDocs dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Test the browser editor and collaboration code
        run: npm test

      - name: Test native Markdown and publication boundaries
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_*.py'

      - name: Test shared Supabase functions
        run: npx --yes deno-bin@2.2.7 test --allow-env 'supabase/functions/_shared/*_test.ts'

      - name: Type-check change request function
        run: npx --yes deno-bin@2.2.7 check supabase/functions/change-requests/index.ts

      - name: Generate public collaboration configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_BRANCH: main
        run: python scripts/render_collaboration_config.py

      - name: Generate and validate glossary
        run: python scripts/build_glossary.py

      - name: Validate course relations
        run: python scripts/validate_course_structure.py

      - name: Strict MkDocs validation
        run: mkdocs build --strict

  merge:
    name: TSSR-merge-v1|${{ needs.attest.outputs.change_id }}|${{ needs.attest.outputs.expected_sha }}|${{ needs.attest.outputs.expected_sha }}
    needs: [attest, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # Explicit dispatch after a GITHUB_TOKEN-authenticated merge.
    steps:
      # Recheck database state and the live GitHub PR immediately before use.
      - name: Re-attest the validated PR head
        env:
          WEBHOOK_URL: ${{ secrets.SUPABASE_PUBLICATION_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.SUPABASE_PUBLICATION_WEBHOOK_SECRET }}
          CHANGE_ID: ${{ needs.attest.outputs.change_id }}
          EXPECTED_SHA: ${{ needs.attest.outputs.expected_sha }}
          PR_NUMBER: ${{ needs.attest.outputs.pr_number }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          change_id, sha = os.environ["CHANGE_ID"], os.environ["EXPECTED_SHA"]
          number = int(os.environ["PR_NUMBER"])
          request = urllib.request.Request(os.environ["WEBHOOK_URL"], method="POST", headers={
              "content-type": "application/json", "x-publication-secret": os.environ["WEBHOOK_SECRET"],
          }, data=json.dumps({
              "action": "verify-pr", "change_request_id": change_id,
              "commit_sha": sha, "pr_number": number,
          }).encode())
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except Exception:
              raise SystemExit("Publication re-attestation failed; no merge is authorized.") from None
          if (result.get("maintenance_protocol") != "tssr-maintenance-v1"
                  or result.get("ok") is not True or result.get("change_request_id") != change_id
                  or result.get("expected_sha") != sha or type(result.get("pr_number")) is not int
                  or result["pr_number"] != number):
              raise SystemExit("Publication re-attestation does not match the validated PR head.")
          PY

      - name: Merge only the validated head and dispatch its deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.attest.outputs.pr_number }}
          CHANGE_ID: ${{ needs.attest.outputs.change_id }}
          EXPECTED_SHA: ${{ needs.attest.outputs.expected_sha }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --match-head-commit "$EXPECTED_SHA" \
            --delete-branch \
            --subject "docs: publish approved change ${CHANGE_ID:0:8}" \
            --body "Change-Request-ID: $CHANGE_ID"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/merged-pr.json"
          merge_sha="$(python - <<'PY'
          import json
          import os
          import re

          with open(os.path.join(os.environ["RUNNER_TEMP"], "merged-pr.json"), encoding="utf-8") as source:
              pull = json.load(source)
          repository = os.environ["GITHUB_REPOSITORY"]
          sha = pull.get("merge_commit_sha", "")
          if (pull.get("merged") is not True or pull.get("number") != int(os.environ["PR_NUMBER"])
                  or pull.get("head", {}).get("sha") != os.environ["EXPECTED_SHA"]
                  or pull.get("head", {}).get("ref") != "collaboration/change-" + os.environ["CHANGE_ID"]
                  or pull.get("head", {}).get("repo", {}).get("full_name") != repository
                  or pull.get("base", {}).get("repo", {}).get("full_name") != repository
                  or pull.get("base", {}).get("ref") != "main"
                  or not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha)):
              raise SystemExit("GitHub did not confirm the exact validated PR merge.")
          print(sha)
          PY
          )"
          gh workflow run deploy-docs.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f change_id="$CHANGE_ID" -f commit_sha="$merge_sha"

  report-failure:
    if: >-
      always() && needs.attest.result == 'success' &&
      (needs.validate.result == 'failure' || needs.validate.result == 'cancelled' ||
       needs.merge.result == 'failure' || needs.merge.result == 'cancelled')
    needs: [attest, validate, merge]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report failed validation or merge
        env:
          WEBHOOK_URL: ${{ secrets.SUPABASE_PUBLICATION_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.SUPABASE_PUBLICATION_WEBHOOK_SECRET }}
          CHANGE_ID: ${{ needs.attest.outputs.change_id }}
          EXPECTED_SHA: ${{ needs.attest.outputs.expected_sha }}
          PR_NUMBER: ${{ needs.attest.outputs.pr_number }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          payload = {
              "change_request_id": os.environ["CHANGE_ID"],
              "expected_sha": os.environ["EXPECTED_SHA"],
              "commit_sha": os.environ["EXPECTED_SHA"],
              "status": "failed", "phase": "pr-validation",
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "pr_number": int(os.environ["PR_NUMBER"]),
              "failure_reason": "La validation ou la fusion de la proposition attestée a échoué.",
          }
          request = urllib.request.Request(os.environ["WEBHOOK_URL"], method="POST", headers={
              "content-type": "application/json", "x-publication-secret": os.environ["WEBHOOK_SECRET"],
          }, data=json.dumps(payload).encode())
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  if json.load(response).get("ok") is not True:
                      raise ValueError("Callback rejected")
          except Exception:
              raise SystemExit("Publication failure callback was not accepted.") from None
          PY
